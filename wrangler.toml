name = "bullshit-court"
account_id = "2a6440274b98eadaa5d57de0c52faece"
main = "worker/src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "bullshitcourt.lol"
custom_domain = true

[[routes]]
pattern = "admin.bullshitcourt.lol"
custom_domain = true

[vars]
COURT_ADMIN_HOST = "admin.bullshitcourt.lol"
COURT_ACCESS_TEAM = "bullshitcourt"
COURT_ACCESS_AUD = "44b9d80853f9d6fe4cae927ff13f4df0673be4483a3dadb69d57c83565945af8"

# One CourtRoom Durable Object per game. SQLite-backed classes are required on
# the Workers free plan and keep storage local to the object.
[[durable_objects.bindings]]
name = "COURT_ROOM"
class_name = "CourtRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CourtRoom"]

# Public lobby and judgment index in the BullshitCourt account.
[[d1_databases]]
binding = "DB"
database_name = "bullshit-court-index"
database_id = "72526d23-df14-4ee3-932a-903f8514cf3f"

# Free-tier friendly per-IP limit on game creation (requests above the limit
# get a 429 from the worker). Remove this block if you don't want it.
[[ratelimits]]
name = "COURT_CREATE_LIMIT"
namespace_id = "1100"
simple = { limit = 10, period = 60 }

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/", "/admin", "/admin/*", "/api/*", "/mcp", "/join/*"]

[secrets]
required = ["COURT_VISITOR_SECRET"]

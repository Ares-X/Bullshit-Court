name = "internet-court"
main = "worker/src/index.ts"
compatibility_date = "2025-09-01"

# One CourtRoom Durable Object per game. SQLite-backed classes are required on
# the Workers free plan and keep storage local to the object.
[[durable_objects.bindings]]
name = "COURT_ROOM"
class_name = "CourtRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CourtRoom"]

# Public lobby / judgment index. Create once with:
#   npx wrangler d1 create internet-court-index
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "internet-court-index"
database_id = "local-dev-placeholder"

# Free-tier friendly per-IP limit on game creation (requests above the limit
# get a 429 from the worker). Remove this block if you don't want it.
[[ratelimits]]
name = "COURT_CREATE_LIMIT"
namespace_id = "1100"
simple = { limit = 10, period = 60 }

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/mcp", "/join/*"]

[vars]
# Optional canonical origin, e.g. "https://court.example.com". Leave unset to
# derive it from the request. Secrets (COURT_VISITOR_SECRET, admin Access vars)
# go in `wrangler secret put ...` or .dev.vars — never in this file.
